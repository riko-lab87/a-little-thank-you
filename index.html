
<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Thank You</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 16px;
  background: #eee9df;
  font-family: "Georgia", "Yu Mincho",
               "Hiragino Mincho ProN", serif;
  color: #62584e;
}

.card {
  position: relative;
  width: 100%;
  max-width: 440px;
  min-height: 590px;
  padding: 65px 30px 45px;
  background: #faf8f2;
  text-align: center;
  border: 1px solid #e5ded1;
  box-shadow: 0 12px 40px rgba(80,65,45,.09);
  overflow: hidden;
  animation: appear 1.5s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  color: #a18c72;
  margin-bottom: 38px;
}

.botanical {
  width: 125px;
  height: 105px;
  margin: 0 auto 35px;
  opacity: 0;
  animation: appear 2s ease .5s forwards;
}

h1 {
  font-size: 27px;
  font-weight: normal;
  letter-spacing: 2px;
  color: #8b765f;
  margin-bottom: 45px;
}

.message {
  font-size: 15px;
  line-height: 2.8;
  letter-spacing: 1px;
  opacity: 0;
  animation: appear 1.5s ease 1s forwards;
}

.message .last {
  display: block;
  margin-top: 24px;
  color: #8b765f;
}

.ornament {
  width: 55px;
  height: 1px;
  background: #d8cbb8;
  margin: 36px auto;
}

.signature {
  font-size: 12px;
  letter-spacing: 2px;
  color: #a18c72;
  font-style: italic;
}

.heart {
  margin-top: 25px;
  color: #c4a99a;
  font-size: 15px;
}
.music {
  margin-top: 22px;
}

.music button {
  background: none;
  border: 1px solid #d8cbb8;
  color: #a18c72;
  padding: 9px 22px;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
}

.music-player {
  display: none;
  margin: 18px auto 0;
  width: 200px;
}

.music-player iframe {
  width: 200px;
  height: 200px;
  border: none;
}

</style>
</head>

<body>

<main class="card">

  <div class="eyebrow">A LITTLE MESSAGE FOR YOU</div>

  <svg class="botanical" viewBox="0 0 140 120"
       fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#a99a80" stroke-width="1.2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 110 C68 80 75 50 65 13"/>
      <path d="M69 85 C49 78 35 58 37 40 C54 46 67 62 69 85Z"/>
      <path d="M68 65 C87 57 98 40 94 24 C78 31 68 46 68 65Z"/>
      <path d="M70 101 C88 91 101 76 102 61 C85 66 73 81 70 101Z"/>
      <path d="M65 48 C52 39 49 26 55 16 C67 26 70 38 65 48Z"/>
      <path d="M37 40 C49 53 57 64 69 85"/>
      <path d="M94 24 C83 37 76 49 68 65"/>
      <path d="M102 61 C89 73 79 85 70 101"/>
      <path d="M55 16 C60 27 63 36 65 48"/>
    </g>
    <g fill="#c5b69d">
      <circle cx="37" cy="40" r="2"/>
      <circle cx="94" cy="24" r="2"/>
      <circle cx="102" cy="61" r="2"/>
      <circle cx="55" cy="16" r="2"/>
    </g>
  </svg>

  <h1>Thank You ♡</h1>

  <div class="message">
    また会えてうれしかった。<br>
    素敵な時間をありがとう。

    <span class="last">
      これからも、楽しい時間を<br>
      重ねていけたらいいね。<br>
      りこ
    </span>
  </div>

  <div class="ornament"></div>

  <div class="signature">With a smile</div>

  <div class="heart">♡</div>
  
  <div class="music">
  <button onclick="toggleMusic()" id="musicButton">
    ♡ PLAY MUSIC
  </button>

  <div class="music-player" id="musicPlayer"></div>
</div>

</main>
  
<script>
function toggleMusic() {
  const player = document.getElementById("musicPlayer");
  const button = document.getElementById("musicButton");

  if (player.style.display === "block") {
    player.innerHTML = "";
    player.style.display = "none";
    button.innerHTML = "♡ PLAY MUSIC";
  } else {
    player.style.display = "block";

    player.innerHTML = `
      <iframe
        src="https://www.youtube-nocookie.com/embed/E95XfTAbq0Q?autoplay=1&playsinline=1&rel=0"
        title="A song for you"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    `;

    button.innerHTML = "♡ STOP MUSIC";
  }
}
</script>
  
</body>
</html>
